name: DEV2 měření (stojí peníze)

# Měření pro refaktor na DEV2 (spec 002). JEN na větvi DEV2, NIKDY nic
# necommituje — výsledky jsou artefakt běhu. Každé spuštění stojí peníze
# (API Anthropic); odhad ceny se ohlašuje vlastníkovi předem.
#
# SPOUŠTÍ SE ZMĚNOU scripts/dev/mereni.json na DEV2, ne tlačítkem: ruční
# spuštění (workflow_dispatch) GitHub nabízí jen workflow z výchozí větve
# a na main refaktor nesahá. Běh proběhne JEN když mereni.json obsahuje
# vyplněné „schvaleno“ (kdo a kdy placený běh schválil) — souhlas je tak
# dohledatelný v historii gitu. Bez něj se job ukončí, nic nezaplatí.
#
# Režimy (mereni.json → rezim):
#   zlata-sada  ohodnotí jen body zlaté sady (scripts/dev/fixtury/zlata-sada.json)
#               nad daty z main a změří shodu s realitou. Nejlevnější měření
#               modelu: ~22 bodů v 9 kapitolách, bez korektury a zpráv.
#   stabilita   dva plné běhy nad týmiž vstupy, porovnání stavů
#               (porovnej-behy.js) a skóre obou proti zlaté sadě.
#   beh         jeden plný běh nad daty z main (generálka), nic se nezveřejní.
#   faktcheck   kontrola faktů (scripts/faktcheck.js --model) bodů zlaté
#               a kontrolní sady nad daty ZAPSANÝMI NA DEV2 (ta, proti kterým
#               vlastník sady ověřil), a skóre faktcheck-skore.js: kolik bodů,
#               kde se web liší od pravdy, kontrola chytila. Hodnocení neběží.
#               kola: 1 = jen kolo 1 (dávka), 2 = obě kola (výchozí).
#
# nahrat_kazetu: běh navíc uloží všechny požadavky a odpovědi do kazety
# (scripts/dev/parita/zmrazit.js, režim nahrat) — podklad pro paritu
# s přehráním a skutečný přepis streamu pro test-modely.js.

on:
  push:
    branches: [DEV2]
    paths: ["scripts/dev/mereni.json"]

permissions:
  contents: read      # nic se necommituje

jobs:
  mereni:
    if: github.ref == 'refs/heads/DEV2'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Parametry a souhlas z scripts/dev/mereni.json. Bez „schvaleno“ konec.
      - name: Parametry a souhlas
        id: m
        run: node scripts/dev/mereni-parametry.js

      # Zdarma a dřív, než se cokoli zaplatí.
      - name: Offline kontroly
        if: steps.m.outputs.spustit == 'true'
        run: |
          for t in korektura zabrany prechody delta odpoved sbirka modely faktcheck; do node scripts/dev/test-$t.js > /dev/null || { node scripts/dev/test-$t.js; exit 1; }; done
          echo "offline kontroly prošly"

      # Vstupem jsou VŽDY data z main: brána rozhoduje podle minulých stavů,
      # a jen s produkčními daty se běh chová jako ostrý.
      - name: Vstupní data z main
        if: steps.m.outputs.spustit == 'true' && steps.m.outputs.rezim != 'faktcheck'
        run: |
          git checkout origin/main -- public/evaluations.json public/history.json public/news.json public/audit.json
          mkdir -p /tmp/vstup && cp public/*.json /tmp/vstup/
          node -e 'const j=require("./public/evaluations.json");console.log("data z main: lastUpdated",j.lastUpdated)'

      - name: Parametry běhu
        if: steps.m.outputs.spustit == 'true'
        id: par
        run: |
          IDS=$(node -e 'console.log(require("./scripts/dev/fixtury/zlata-sada.json").body.map(b=>b.id).join(","))')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "dnes=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "Modely: hodnocení=${EVAL_MODEL:-nastavení} ověření=${OVEROVACI_MODEL:-nastavení} korektura=${KOREKTURA_MODEL:-nastavení}"

      # Kontrola faktů nad daty zapsanými na DEV2: sady platí k datu, ke kterému
      # je vlastník ověřil, a main mezitím může mít novější běh.
      - name: Kontrola faktů (zlatá + kontrolní sada)
        if: steps.m.outputs.spustit == 'true' && steps.m.outputs.rezim == 'faktcheck'
        run: |
          mkdir -p /tmp/vysledky
          node -e 'const j=require("./public/evaluations.json");console.log("data z DEV2: lastUpdated",j.lastUpdated)'
          IDS=$(node -e 'const z=require("./scripts/dev/fixtury/zlata-sada.json"),k=require("./scripts/dev/fixtury/kontrolni-sada.json");console.log([...new Set([...z.body,...k.body].map(b=>b.id))].join(","))')
          KOLA=""; if [ "${{ steps.m.outputs.kola }}" = "1" ]; then KOLA="--bez-kola2"; fi
          node scripts/faktcheck.js --model --body "$IDS" $KOLA --vystup /tmp/vysledky/faktcheck 2>&1 | tee /tmp/vysledky/faktcheck.log
          node scripts/dev/faktcheck-skore.js /tmp/vysledky/faktcheck public/evaluations.json | tee /tmp/vysledky/skore-faktcheck.txt

      - name: Běh 1
        if: steps.m.outputs.spustit == 'true' && steps.m.outputs.rezim != 'faktcheck'
        env:
          REZIM_BEHU: plny
          CHAPTER_LIMIT: "18"
          BODY: ${{ steps.m.outputs.rezim == 'zlata-sada' && steps.par.outputs.ids || '' }}
          BEZ_KOREKTURY: ${{ steps.m.outputs.rezim == 'beh' && '0' || '1' }}
          BEZ_ZPRAV: ${{ steps.m.outputs.rezim == 'beh' && '0' || '1' }}
          PARITA_ODPOVEDI: nahrat
          PARITA_DNES: ${{ steps.par.outputs.dnes }}
          PARITA_KAZETA: /tmp/vysledky/kazeta-beh1.json
        run: |
          mkdir -p /tmp/vysledky
          if [ "${{ steps.m.outputs.kazeta }}" = "true" ]; then
            node --import ./scripts/dev/parita/zmrazit.js scripts/evaluate.js 2>&1 | tee /tmp/vysledky/beh1.log
          else
            node scripts/evaluate.js 2>&1 | tee /tmp/vysledky/beh1.log
          fi
          mkdir -p /tmp/vysledky/beh1 && cp public/*.json /tmp/vysledky/beh1/
          node scripts/dev/zlata-sada-skore.js public/evaluations.json | tee /tmp/vysledky/skore-beh1.txt

      - name: Běh 2 (stabilita)
        if: steps.m.outputs.spustit == 'true' && steps.m.outputs.rezim == 'stabilita'
        env:
          REZIM_BEHU: plny
          CHAPTER_LIMIT: "18"
          BEZ_KOREKTURY: "1"
          BEZ_ZPRAV: "1"
        run: |
          cp /tmp/vstup/*.json public/
          rm -f public/naklady.json
          node scripts/evaluate.js 2>&1 | tee /tmp/vysledky/beh2.log
          mkdir -p /tmp/vysledky/beh2 && cp public/*.json /tmp/vysledky/beh2/
          node scripts/dev/zlata-sada-skore.js public/evaluations.json | tee /tmp/vysledky/skore-beh2.txt
          node scripts/dev/porovnej-behy.js /tmp/vysledky/beh1/evaluations.json /tmp/vysledky/beh2/evaluations.json | tee /tmp/vysledky/stabilita.txt

      - name: Souhrn
        if: always() && steps.m.outputs.spustit == 'true'
        run: |
          {
            echo "## Měření DEV2 — ${{ steps.m.outputs.rezim }}"
            echo
            grep -h "^Cena běhu" /tmp/vysledky/beh*.log 2>/dev/null | sed 's/^/- /'
            grep -h "^Cena vrstvy M" /tmp/vysledky/faktcheck.log 2>/dev/null | sed 's/^/- /'
            if [ -f /tmp/vysledky/skore-faktcheck.txt ]; then echo "### kontrola faktů"; echo '```'; grep -E "^(souhrn|Akceptace)" /tmp/vysledky/skore-faktcheck.txt; echo '```'; fi
            echo
            for f in /tmp/vysledky/skore-beh*.txt; do [ -f "$f" ] && { echo "### $(basename $f)"; echo '```'; tail -8 "$f"; echo '```'; }; done
            if [ -f /tmp/vysledky/stabilita.txt ]; then echo "### stabilita"; echo '```'; head -8 /tmp/vysledky/stabilita.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Výsledky jako artefakt
        if: always() && steps.m.outputs.spustit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dev2-mereni-${{ steps.m.outputs.rezim }}-${{ github.run_id }}
          path: /tmp/vysledky
          if-no-files-found: warn
