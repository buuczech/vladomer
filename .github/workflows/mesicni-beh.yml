name: Měsíční běh

# Celý měsíční běh na jednom místě (spec 003, 004, 005). Volá ho deploy.yml
# (ostrý běh na main, 1. dne v měsíci) a dev2-eval.yml (generálka na DEV2,
# zkouska: true — všechno kromě zveřejnění). Jedna definice pro obojí, aby
# generálka zkoušela přesně to, co pak poběží naostro.
#
#   hodnocení (evaluate.js) → kontrola faktů (faktcheck.js --model)
#   → rozhodnutí (rozhodni.js: ověřené ven, sporné podržet)
#   → kontrola konzistence → commit na main → PR s podrženými návrhy
#   → report e-mailem (PDF + pro-AI.md)
#
# Generálka (zkouska: true) dělá totéž, jen commit jde na zahazovací větev
# zkouska/RRRR-MM a PR beh/RRRR-MM-zkouska míří tam. Rozhodování z e-mailu
# jde tak vyzkoušet celé (rozhodnuti-vetev.yml); Zveřejnit sloučí PR do
# zahazovací větve a web jen sestaví. Příspěvek na Instagram se sestaví jako
# artefakt. Na main, na vladomer.cz ani na Instagram nejde nic.
# Generálka může vzít vstupní data z jiné větve (vstup_dat: main = to, co
# je teď na webu; zkouska/RRRR-MM = navázat na minulou generálku i s
# rozhodnutími vlastníka) a e-mail pak nese srovnání s main (lib/srovnani.js):
# DEV2 se sloučí až po dvou generálkách srovnaných s main (vlastník,
# 23. 10. 2026).
#
# Stojí peníze (API Anthropic). Pojistka ceny (pojistka_ceny_usd) zastaví
# zacyklený běh; pak se nic nezveřejní a přijde e-mail o selhání.

on:
  workflow_call:
    inputs:
      rezim_behu:
        description: "plny = měsíční plný audit, delta = mimořádný běh"
        type: string
        default: plny
      zkouska:
        description: "generálka: běh i PR jdou do zahazovací větve zkouska/RRRR-MM, nic na main, web ani Instagram; e-mail má [ZKOUŠKA]"
        type: boolean
        default: false
      pojistka_usd:
        description: "strop ceny celého běhu; prázdné = pojistka_ceny_usd z nastaveni.txt"
        type: string
        default: ""
      vstup_dat:
        description: "jen generálka: větev, ze které se vezmou public/*.json (main | zkouska/RRRR-MM); prázdné = data na větvi, ze které běh běží"
        type: string
        default: ""
    outputs:
      zapsano:
        description: "true, když běh zapsal nová data na main"
        value: ${{ jobs.beh.outputs.na_main }}

jobs:
  beh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      na_main: ${{ steps.zapis.outputs.na_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Pravidla dřív, než se cokoli zaplatí.
      - name: Offline kontroly
        run: |
          for t in zabrany sbirka korektura prechody delta odpoved modely faktcheck psp plan zneni rozhodnuti report email soukromi; do
            node scripts/dev/test-$t.js > /dev/null || { node scripts/dev/test-$t.js; exit 1; }
          done
          echo "offline kontroly prošly"

      # Generálka: vstupní data z jiné větve. main = to, co je teď na webu
      # (týdenní běh); zkouska/RRRR-MM = navázat na minulou generálku i s tím,
      # co v ní vlastník rozhodl. Naostro běh čte vždy data main, na kterém běží.
      - name: Vstupní data generálky
        if: inputs.zkouska && inputs.vstup_dat != ''
        env:
          VSTUP: ${{ inputs.vstup_dat }}
        run: |
          echo "$VSTUP" | grep -Eqx 'main|zkouska/[0-9]{4}-[0-9]{2}' || { echo "vstup_dat „$VSTUP“: povoleno main nebo zkouska/RRRR-MM"; exit 1; }
          git fetch --no-tags origin "refs/heads/$VSTUP"
          git checkout FETCH_HEAD -- public/evaluations.json public/history.json public/news.json public/audit.json
          # Cena a kontrola faktů minulého běhu patří ke svým datům; main je nemá.
          for f in naklady.json faktcheck.json; do
            if git cat-file -e "FETCH_HEAD:public/$f" 2>/dev/null; then git checkout FETCH_HEAD -- "public/$f"; else rm -f "public/$f"; fi
          done
          git log -1 --format="Vstupní data z $VSTUP: %h %s (%ci)" FETCH_HEAD
          node -e 'console.log(`lastUpdated ${require("./public/evaluations.json").lastUpdated}`)'

      # Plánovač GitHubu umí běh opozdit o hodiny a jednou už pustil druhý běh
      # téhož dne (28. 8. 2026). Plánovaný běh se přeskočí, jsou-li data už
      # z tohoto měsíce; ruční spuštění běží vždy — to je úmysl.
      - name: Už tento měsíc hodnoceno?
        id: mesic
        run: |
          node -e '
            const j = require("./public/evaluations.json");
            const mesic = new Date().toISOString().slice(0, 7);
            const hotovo = process.env.UDALOST === "schedule" && String(j.lastUpdated || "").slice(0, 7) === mesic;
            console.log(hotovo ? `Data jsou už z ${mesic}, plánovaný běh se přeskočí.` : "Běží se.");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `preskocit=${hotovo}\n`);
          '
        env:
          UDALOST: ${{ github.event_name }}

      - name: Data před během
        if: steps.mesic.outputs.preskocit != 'true'
        run: mkdir -p /tmp/pred && cp public/*.json /tmp/pred/

      - name: Hodnocení
        if: steps.mesic.outputs.preskocit != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REZIM_BEHU: ${{ inputs.rezim_behu }}
          NAVRHY_BEHU: /tmp/navrhy.json
          POJISTKA_CENY_USD: ${{ inputs.pojistka_usd }}
        run: node scripts/evaluate.js 2>&1 | tee /tmp/hodnoceni.log; exit ${PIPESTATUS[0]}

      # Selhání kontroly faktů zastaví celý běh: bez ní by se nic nesmělo
      # pustit jako ověřené a web radši zůstane na minulém měsíci.
      - name: Kontrola faktů
        if: steps.mesic.outputs.preskocit != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POJISTKA_CENY_USD: ${{ inputs.pojistka_usd }}
        run: node scripts/faktcheck.js --model --zapsat-naklady 2>&1 | tee /tmp/faktcheck.log; exit ${PIPESTATUS[0]}

      - name: Rozhodnutí (ověřené ven, sporné podržet)
        if: steps.mesic.outputs.preskocit != 'true'
        run: node scripts/rozhodni.js --pred /tmp/pred/evaluations.json --navrhy /tmp/navrhy.json

      # Konzistence dat, která půjdou ven. Když neprojde, nic se nezveřejní.
      - name: Kontrola čerstvých dat
        if: steps.mesic.outputs.preskocit != 'true'
        run: node scripts/dev/test-konzistence.js

      - name: Obrázek pro sdílení
        if: steps.mesic.outputs.preskocit != 'true'
        run: node scripts/og-image.js || echo "og-image selhalo — ponechávám minulý obrázek"

      # Vrstva D5: sestavený web proti datům (ukazatel, /prehled/, /overview/,
      # JSON-LD). Rozpor zastaví běh dřív, než se cokoli zapíše.
      - name: Vykreslený web proti datům
        if: steps.mesic.outputs.preskocit != 'true'
        run: npm run build && node scripts/kontrola-webu.js

      # Naostro commit na main. Generálka commitne na zahazovací větev
      # zkouska/RRRR-MM (z kódu, na kterém běží) — PR s návrhy pak míří tam.
      - name: Zápis běhu
        id: zapis
        if: steps.mesic.outputs.preskocit != 'true'
        env:
          ZKOUSKA: ${{ inputs.zkouska }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CIL=main; ZPRAVA="chore: monthly evaluation $(date -u +%Y-%m)"
          if [ "$ZKOUSKA" = "true" ]; then
            CIL="zkouska/$(date -u +%Y-%m)"; ZPRAVA="Generálka: měsíční běh $(date -u +%Y-%m) (zkouška, nic se nezveřejní)"
            git switch -c "$CIL"
          fi
          git add public/evaluations.json public/history.json public/news.json public/audit.json public/og.png public/naklady.json public/faktcheck.json
          git commit -m "$ZPRAVA" || { echo "zapsano=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$ZKOUSKA" = "true" ]; then
            # Zahazovací větev: opakovaná generálka téhož měsíce ji přepíše.
            git push --force origin "HEAD:refs/heads/$CIL"
          else
            # Rebase je bezpečný: běh sahá jen na public/*.json a og.png.
            git pull --rebase --autostash origin main
            git push
            echo "na_main=true" >> "$GITHUB_OUTPUT"
          fi
          echo "zapsano=true" >> "$GITHUB_OUTPUT"
          echo "cil=$CIL" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Podržené body s návrhem jdou do PR beh/RRRR-MM (generálka:
      # beh/RRRR-MM-zkouska do zkouska/RRRR-MM). Starší nevyřízený PR téhož
      # druhu se zavře: tyhle body tenhle běh posoudil znovu.
      - name: PR s návrhy k rozhodnutí
        id: pr
        if: steps.zapis.outputs.zapsano == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZKOUSKA: ${{ inputs.zkouska }}
          CIL: ${{ steps.zapis.outputs.cil }}
        run: |
          VETEV="beh/$(date -u +%Y-%m)"; TITULEK="Vládoměr $(date -u +%Y-%m): návrhy k rozhodnutí"
          if [ "$ZKOUSKA" = "true" ]; then VETEV="$VETEV-zkouska"; TITULEK="[ZKOUŠKA] $TITULEK"; fi
          for r in $(gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("beh/")) | "\(.number):\(.headRefName)"'); do
            case "${r#*:}" in *-zkouska) DRUH=true ;; *) DRUH=false ;; esac
            [ "$DRUH" = "$ZKOUSKA" ] || continue
            gh pr close "${r%%:*}" --comment "Nahrazeno během $(date -u +%Y-%m): podržené body se posoudily znovu." --delete-branch || true
          done
          git switch -c "$VETEV"
          node scripts/navrhy.js vytvor --rozhodnuti faktcheck-vystup/rozhodnuti.json --zaklad "${{ steps.zapis.outputs.sha }}" | tee /tmp/navrhy-pr.log
          if grep -q "^návrhů: 0" /tmp/navrhy-pr.log; then echo "Nic k rozhodnutí, PR se nezakládá."; exit 0; fi
          git add public/evaluations.json public/audit.json public/history.json public/faktcheck.json navrhy/
          git commit -m "Návrhy z běhu $(date -u +%Y-%m) k rozhodnutí vlastníka"
          # Větev je čerstvě složená z commitu běhu; starší téhož jména patřila
          # zavřenému PR. --force-with-lease by tu selhal na zastaralé
          # vzdálené větvi z checkoutu.
          git push --force -u origin "$VETEV"
          node scripts/report.js --pred /tmp/pred/evaluations.json --bez-pdf --vystup /tmp/report-pr > /dev/null
          # Zakládat PR smí workflow jen s povolením v nastavení repozitáře
          # (Settings → Actions → General → „Allow GitHub Actions to create and
          # approve pull requests“). Bez něj e-mail dostane odkaz na porovnání
          # větví, odkud jde PR založit jedním klepnutím.
          if URL=$(gh pr create --base "$CIL" --head "$VETEV" --title "$TITULEK" --body-file /tmp/report-pr/pr.md); then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "vetev=$VETEV" >> "$GITHUB_OUTPUT"
          else
            echo "PR nešlo založit — povol v nastavení repozitáře zakládání PR z Actions. Posílám odkaz na větev."
            echo "url=${{ github.server_url }}/${{ github.repository }}/compare/$CIL...$VETEV?expand=1" >> "$GITHUB_OUTPUT"
          fi
          git switch -

      # Generálka: měsíční příspěvek na Instagram se sestaví z dat běhu (jako
      # naostro po nasazení) a s webem přiloží k běhu. Nezveřejní se nic.
      - uses: actions/setup-node@v4
        if: inputs.zkouska && steps.zapis.outputs.zapsano == 'true'
        with:
          node-version: 24
      - name: Zkouška — web a příspěvek na Instagram jako artefakt
        if: inputs.zkouska && steps.zapis.outputs.zapsano == 'true'
        run: |
          mkdir -p zkouska-vystup/instagram
          cp -r dist zkouska-vystup/web
          node scripts/instagram/post.js --rezim build | tee zkouska-vystup/instagram/log.txt || echo "příspěvek se nesestavil — viz log"
          D=$(node -e 'console.log(String(require("./public/evaluations.json").lastUpdated).slice(0,10))')
          cp ig-archive/"$D"* zkouska-vystup/instagram/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: inputs.zkouska && steps.zapis.outputs.zapsano == 'true'
        with:
          name: zkouska-web-a-instagram-${{ github.run_id }}
          path: zkouska-vystup
          if-no-files-found: warn

      - name: Report e-mailem
        if: steps.mesic.outputs.preskocit != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          PR_URL: ${{ steps.pr.outputs.url }}
          VETEV: ${{ steps.pr.outputs.vetev }}
        run: |
          ZK=""; if [ "${{ inputs.zkouska }}" = "true" ]; then ZK="--zkouska"; fi
          # Generálka: srovnání s tím, co teď ukazuje main (e-mail, příloha,
          # souhrn běhu). Když main nejde načíst, e-mail odejde bez něj.
          SR=""
          if [ "${{ inputs.zkouska }}" = "true" ] && git fetch --no-tags origin refs/heads/main && git show FETCH_HEAD:public/evaluations.json > /tmp/main-evaluations.json; then
            SR="--srovnani-main /tmp/main-evaluations.json"
          fi
          PR=""; if [ -n "$PR_URL" ]; then PR="--pr $PR_URL"; fi
          # S větví PR dostane e-mail u každého bodu odkazy Přijmout / Nechat a Zveřejnit
          # (i v generálce — tam míří do zkušební větve).
          if [ -n "$VETEV" ]; then PR="$PR --vetev $VETEV"; fi
          node scripts/report.js --pred /tmp/pred/evaluations.json --poslat $ZK $PR $SR || echo "report: e-mail neodešel, report je v artefaktu"
          if [ -f report/srovnani-s-main.md ]; then cat report/srovnani-s-main.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: E-mail o selhání
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          ZK=""; if [ "${{ inputs.zkouska }}" = "true" ]; then ZK="--zkouska"; fi
          node scripts/report.js --selhani "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" $ZK

      # Zaplacený běh se nesmí ztratit s runnerem — ani když selže.
      - name: Výstupy běhu jako artefakt (příprava)
        if: always() && steps.mesic.outputs.preskocit != 'true'
        run: mkdir -p beh-vystup && cp /tmp/navrhy.json /tmp/hodnoceni.log /tmp/faktcheck.log beh-vystup/ 2>/dev/null || true
      - name: Výstupy běhu jako artefakt
        if: always() && steps.mesic.outputs.preskocit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mesicni-beh-${{ github.run_id }}
          path: |
            public/*.json
            public/og.png
            faktcheck-vystup/*.json
            report/
            necitelne-odpovedi/
            beh-vystup/
          if-no-files-found: ignore
