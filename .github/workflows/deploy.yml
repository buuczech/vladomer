name: Deploy Vládoměr

on:
  push:
    branches: [main]
  workflow_dispatch:        # ruční běh: mimořádný (delta) nebo opakovaný měsíční
    inputs:
      rezim_behu:
        description: "plny = měsíční plný audit; delta = mimořádný běh jen pro body s událostí"
        type: choice
        options: [plny, delta]
        default: plny
  schedule:
    # 1. den v měsíci 05:15 UTC: stav ke konci měsíce. Ne poslední den —
    # plánovač GitHubu se zpožďuje o hodiny a běh by sklouzl do nového měsíce.
    - cron: "15 5 1 * *"

permissions:
  contents: write           # commit dat běhu, větev s návrhy
  pull-requests: write      # PR s podrženými návrhy k rozhodnutí vlastníka
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Hodnocení, kontrola faktů, rozhodnutí, zápis, PR a report (mesicni-beh.yml).
  # Push na main nikdy nehodnotí: merge jen sestaví a nasadí web.
  beh:
    if: ${{ github.event_name != 'push' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/mesicni-beh.yml
    with:
      rezim_behu: ${{ inputs.rezim_behu || 'plny' }}
      zkouska: false
    secrets: inherit

  build-deploy:
    needs: beh
    # Po běhu jen když prošel (jinak web zůstává na minulém měsíci); po pushi vždy.
    if: ${{ always() && (needs.beh.result == 'success' || needs.beh.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: main, aby se nasadil i commit, který běh právě zapsal.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Testy PRAVIDEL, ne dat. Nic nestojí, nic neodesílají, běží pár vteřin.
      - name: Offline checks
        run: |
          node scripts/dev/test-zabrany.js
          node scripts/dev/test-sbirka.js
          node scripts/dev/test-korektura.js
          node scripts/dev/test-prechody.js
          node scripts/dev/test-delta.js
          node scripts/dev/test-odpoved.js
          node scripts/dev/test-modely.js
          node scripts/dev/test-faktcheck.js
          node scripts/dev/test-rozhodnuti.js
          node scripts/dev/test-email.js
          node scripts/dev/test-soukromi.js

      # Konzistence ZVEŘEJNĚNÝCH dat. Schválně NEblokuje: data jsou v tu chvíli
      # venku, takže zastavené nasazení nic nespraví — jen by zabránilo i té
      # změně, která je opravou. Čerstvá data běhu hlídá mesicni-beh.yml
      # PŘED zápisem, a to blokuje.
      - name: Check published data
        continue-on-error: true
        run: node scripts/dev/test-konzistence.js

      - run: npm run build

      # Sestavený web je veřejný: žádná e-mailová adresa ani klíč (spec 005).
      - name: Soukromí v sestaveném webu
        run: node scripts/dev/test-soukromi.js --dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
