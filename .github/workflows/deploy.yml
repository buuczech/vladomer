name: Deploy Vládoměr

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a run (incl. evaluation) by hand
  schedule:
    - cron: "0 9 * * 5"     # every Friday 09:00 UTC

permissions:
  contents: write           # to commit the refreshed evaluations.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Testy PRAVIDEL, ne dat. Nic nestojí, nic neodesílají, běží pár vteřin.
      # Musí být první: když je rozbité pravidlo, ať to spadne dřív, než se
      # za hodnocení zaplatí.
      - name: Offline checks
        run: |
          node scripts/dev/test-zabrany.js
          node scripts/dev/test-korektura.js

      # Konzistence UŽ ZVEŘEJNĚNÝCH dat. Schválně NEblokuje: data jsou v tu
      # chvíli dávno venku, takže zastavené nasazení nic nespraví — jen by
      # zabránilo i té změně, která je opravou. A hlavně tenhle krok nesmí
      # předcházet hodnocení: páteční běh je jediné, co takový nález umí
      # spravit, a kontrola před ním by ho zablokovala napořád.
      - name: Check published data
        continue-on-error: true
        run: node scripts/dev/test-konzistence.js

      # Run the AI evaluation only on the Friday schedule or a manual run,
      # not on ordinary code pushes. Needs the ANTHROPIC_API_KEY repo secret.
      - name: Weekly AI evaluation
        if: ${{ github.event_name != 'push' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run evaluate

      # Konzistence čerstvých dat JEŠTĚ PŘED commitem. Když neprojde, job
      # spadne, nic se nezveřejní a na webu zůstane minulý týden. Zaplacený
      # běh se ale neztratí — jeho výstup se uloží jako artefakt a dá se
      # prohlédnout a rozhodnout ručně.
      - name: Check fresh data
        id: kontrola
        if: ${{ github.event_name != 'push' }}
        run: node scripts/dev/test-konzistence.js

      - name: Keep unpublished data for inspection
        if: ${{ failure() && steps.kontrola.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: nezverejnena-data
          path: public/*.json

      # Náhledový obrázek pro sdílení nese aktuální čísla, takže se překresluje
      # spolu s daty. Kreslí ho headless Chrome (na runneru předinstalovaný).
      # Selhání nesmí shodit nasazení — u odkazu zůstane minulý obrázek, což je
      # nesrovnatelně méně zlé než zahozený týdenní běh.
      - name: Refresh share image
        if: ${{ github.event_name != 'push' }}
        run: node scripts/og-image.js || echo "og-image selhalo — ponechávám minulý obrázek"

      - name: Commit refreshed evaluations
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # All four must be staged: history.json feeds the trend chart and
          # audit.json is the append-only record the methodology promises.
          # Staging only evaluations.json meant neither ever grew on main.
          git add public/evaluations.json public/history.json public/news.json public/audit.json public/og.png
          git commit -m "chore: weekly evaluation $(date -u +%F)" || echo "no changes"
          git push || echo "nothing to push"

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
