name: Dev Evaluation Test

# Cheap test run: evaluates only the first few chapters (CHAPTER_LIMIT) so you
# can verify prompt/script changes without spending tokens on all 18 chapters.
# Chapter 2 (Finance, 15 items) is the historically problematic one — keep the
# limit at 2+ so it stays covered.
# For a full 18-chapter run: include [full] in the commit message, or trigger
# the workflow manually with chapter_limit=18. A full run takes ~30-45 min.
# Deliberately has NO build/deploy-pages step — a run on this branch can
# never publish to or overwrite the live production site.

on:
  workflow_dispatch:
    inputs:
      chapter_limit:
        description: "How many chapters to evaluate (18 = full dataset)"
        required: false
        default: "5"
  push:
    branches: [dev]
    # Jen když se změní to, co běh ověřuje. Bez filtru stál každý push na dev
    # 5 kapitol hodnocení, korekturu i vyhledávání zpráv — i když šlo o přesun
    # tlačítka v JSX, na kterém výsledek hodnocení nijak nezávisí.
    # src/data.js tu je schválně: mění se v něm znění závazků, a ta se hodnotí.
    paths:
      - "scripts/**"
      - "src/data.js"
      - ".github/workflows/dev-eval.yml"

permissions:
  contents: write

jobs:
  eval-test:
    # This file also exists on main (it arrives with every merge). The guard
    # makes sure a manual dispatch there can never overwrite production data
    # with a partial 5-chapter run.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Test evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pushes stay cheap (5 chapters). Put [full] in the commit message —
          # or use the manual dispatch input — to evaluate all 18.
          CHAPTER_LIMIT: ${{ github.event.inputs.chapter_limit || (contains(github.event.head_commit.message, '[full]') && '18') || '5' }}
        # tee the log into the repo so failures are diagnosable without
        # opening the (login-gated) Actions UI
        run: npm run evaluate 2>&1 | tee eval-log.txt

      - name: Commit test evaluation
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f on the log: it's gitignored so it can never reach main, but on
          # this branch it's the only way to read a failed run's output.
          git add public/evaluations.json public/history.json public/news.json public/audit.json
          git add -f eval-log.txt
          git commit -m "chore: dev test evaluation $(date -u +%F)" || echo "no changes"
          git push || echo "nothing to push"
