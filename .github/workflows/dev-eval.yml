name: Dev Evaluation Test

# Cheap test run: evaluates only the first chapter (CHAPTER_LIMIT) so you can
# verify prompt/script changes without spending tokens on all 18 chapters.
# Deliberately has NO build/deploy-pages step — a run on this branch can
# never publish to or overwrite the live production site.

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  eval-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Test evaluation (first chapter only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAPTER_LIMIT: "1"
        run: npm run evaluate

      - name: Commit test evaluation
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/evaluations.json public/history.json
          git commit -m "chore: dev test evaluation (chapter 1 only) $(date -u +%F)" || echo "no changes"
          git push || echo "nothing to push"
