name: Rozhodnutí vlastníka v PR

# Rozhodnutí o návrzích z běhu komentářem v PR beh/RRRR-MM (spec 005), každý
# příkaz na vlastním řádku. Tlačítka z e-mailu a PDF jdou jinudy: zakládají
# soubor ve větvi PR a provádí je rozhodnuti-vetev.yml.
# Příkazy: /prijmout <bod>, /podrzet <bod>, u vyvráceného tvrzení
# /prijmout <bod> duvod: …, a /zverejnit (sloučí PR a nasadí web).
# Merge PR v GitHubu udělá totéž co /zverejnit, Close nepřijme nic.
#
# Bezpečnost:
#   - platí JEN pro vlastníka repozitáře (login i author_association),
#   - text jde do skriptu přes proměnnou prostředí a čte ho přísný regex
#     v lib/navrhy.js; nikdy se nevkládá do příkazové řádky,
#   - spouští se kód z výchozí větve; větev PR je vedle (adresář pr/) jen
#     jako data, takže obsah PR nemůže nic spustit.
# GitHub spouští workflow na issue_comment vždy z výchozí větve — funguje
# tedy až od sloučení DEV2 do main, a jen pro ostrý PR (ne pro generálku).

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: write          # /zverejnit spouští nasazení (deploy.yml)

concurrency:
  group: rozhodnuti
  cancel-in-progress: false

jobs:
  prikaz:
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, '/prijmout') || contains(github.event.comment.body, '/podrzet') || contains(github.event.comment.body, '/zverejnit'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Větev PR, ve kterém komentář padl: jen otevřený PR ve tvaru beh/RRRR-MM.
      - name: Větev PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          CISLO: ${{ github.event.issue.number }}
        run: |
          VETEV=$(gh pr view "$CISLO" --json headRefName,state -q 'select(.state == "OPEN") | .headRefName')
          PR="$CISLO"
          case "$VETEV" in
            beh/[0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
            *) VETEV="" ;;
          esac
          if [ -z "$VETEV" ]; then echo "Není otevřený PR beh/RRRR-MM — nic se nedělá."; exit 0; fi
          echo "vetev=$VETEV" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.vetev != ''
        with:
          ref: ${{ steps.pr.outputs.vetev }}
          path: pr
          fetch-depth: 0

      - name: Provést příkazy
        id: proved
        if: steps.pr.outputs.vetev != ''
        env:
          KOMENTAR: ${{ github.event.comment.body }}
          KDO: ${{ github.event.sender.login }}
          VETEV: ${{ steps.pr.outputs.vetev }}
        run: |
          SOUBOR="navrhy/${VETEV#beh/}.json"
          node scripts/navrhy.js komentar --soubor "$SOUBOR" --koren pr > /tmp/odpoved.md
          cd pr
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/evaluations.json public/audit.json public/history.json public/faktcheck.json "$SOUBOR"
          git commit -m "Rozhodnutí vlastníka v PR" || echo "beze změny"
          git push

      - name: Odpověď do PR
        if: steps.pr.outputs.vetev != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: gh pr comment "$PR" --body-file /tmp/odpoved.md

      # /zverejnit: sloučit PR a nasadit web. Push, který udělá token
      # workflow, nasazení sám nespustí, proto se spouští ručně a jen
      # sestavení a nasazení (jen_nasadit) — hodnocení znovu neběží.
      - name: Zveřejnit (sloučit PR a nasadit)
        if: steps.proved.outputs.zverejnit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          gh pr merge "$PR" --merge --delete-branch
          gh workflow run deploy.yml --ref main -f jen_nasadit=true
          gh pr comment "$PR" --body "Sloučeno a nasazení spuštěno — web se aktualizuje během pár minut."

