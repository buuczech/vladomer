name: Rozhodnutí vlastníka v PR

# Rozhodnutí o návrzích z běhu (PR beh/RRRR-MM, spec 005). Dvě cesty:
#   - odkaz z e-mailu/PDF: otevře na GitHubu předvyplněné issue
#     „Rozhodnutí beh/RRRR-MM: /prijmout 10.2“ a vlastník ho jen potvrdí,
#   - komentář přímo v PR, každý příkaz na vlastním řádku.
# Příkazy: /prijmout <bod>, /podrzet <bod>, u vyvráceného tvrzení
# /prijmout <bod> duvod: …, a /zverejnit (sloučí PR a nasadí web).
# Merge PR v GitHubu udělá totéž co /zverejnit, Close nepřijme nic.
#
# Bezpečnost:
#   - platí JEN pro vlastníka repozitáře (login i author_association),
#   - text jde do skriptu přes proměnnou prostředí a čte ho přísný regex
#     v lib/navrhy.js; nikdy se nevkládá do příkazové řádky,
#   - spouští se kód z výchozí větve; větev PR je vedle (adresář pr/) jen
#     jako data, takže obsah PR nemůže nic spustit.
# GitHub spouští workflow na issue_comment a issues vždy z výchozí větve —
# funguje tedy až od sloučení DEV2 do main.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write          # /zverejnit spouští nasazení (deploy.yml)

concurrency:
  group: rozhodnuti
  cancel-in-progress: false

jobs:
  prikaz:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         github.event.comment.author_association == 'OWNER' &&
         (contains(github.event.comment.body, '/prijmout') || contains(github.event.comment.body, '/podrzet') || contains(github.event.comment.body, '/zverejnit'))) ||
        (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' &&
         startsWith(github.event.issue.title, 'Rozhodnutí beh/'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Větev a číslo PR: u komentáře z PR samotného, u issue z titulku
      # (přísný tvar beh/RRRR-MM) a otevřeného PR s touto větví.
      - name: Větev PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          UDALOST: ${{ github.event_name }}
          CISLO: ${{ github.event.issue.number }}
          TITULEK: ${{ github.event.issue.title }}
        run: |
          if [ "$UDALOST" = "issue_comment" ]; then
            VETEV=$(gh pr view "$CISLO" --json headRefName,state -q 'select(.state == "OPEN") | .headRefName')
            PR="$CISLO"
          else
            VETEV=$(node -e 'const m=String(process.env.TITULEK).match(/^Rozhodnutí (beh\/\d{4}-\d{2}):/); console.log(m ? m[1] : "")')
            PR=$(gh pr list --state open --head "$VETEV" --json number -q '.[0].number' 2>/dev/null)
          fi
          case "$VETEV" in
            beh/[0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
            *) VETEV="" ;;
          esac
          if [ -z "$VETEV" ] || [ -z "$PR" ]; then
            echo "Není otevřený PR beh/RRRR-MM — nic se nedělá."
            if [ "$UDALOST" = "issues" ]; then gh issue close "$CISLO" --comment "K tomuto rozhodnutí není otevřený PR (možná už byl sloučen nebo zavřen další během). Nic se nezměnilo."; fi
            exit 0
          fi
          echo "vetev=$VETEV" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.vetev != ''
        with:
          ref: ${{ steps.pr.outputs.vetev }}
          path: pr
          fetch-depth: 0

      - name: Provést příkazy
        id: proved
        if: steps.pr.outputs.vetev != ''
        env:
          KOMENTAR: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
          KDO: ${{ github.event.sender.login }}
          VETEV: ${{ steps.pr.outputs.vetev }}
        run: |
          SOUBOR="navrhy/${VETEV#beh/}.json"
          node scripts/navrhy.js komentar --soubor "$SOUBOR" --koren pr > /tmp/odpoved.md
          cd pr
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/evaluations.json public/audit.json public/history.json public/faktcheck.json "$SOUBOR"
          git commit -m "Rozhodnutí vlastníka v PR" || echo "beze změny"
          git push

      - name: Odpověď do PR
        if: steps.pr.outputs.vetev != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: gh pr comment "$PR" --body-file /tmp/odpoved.md

      # /zverejnit: sloučit PR a nasadit web. Push, který udělá token
      # workflow, nasazení sám nespustí, proto se spouští ručně a jen
      # sestavení a nasazení (jen_nasadit) — hodnocení znovu neběží.
      - name: Zveřejnit (sloučit PR a nasadit)
        if: steps.proved.outputs.zverejnit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          gh pr merge "$PR" --merge --delete-branch
          gh workflow run deploy.yml --ref main -f jen_nasadit=true
          gh pr comment "$PR" --body "Sloučeno a nasazení spuštěno — web se aktualizuje během pár minut."

      - name: Zavřít issue s rozhodnutím
        if: github.event_name == 'issues' && steps.pr.outputs.vetev != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CISLO: ${{ github.event.issue.number }}
          PR: ${{ steps.pr.outputs.pr }}
        run: gh issue close "$CISLO" --comment "Provedeno v PR #$PR."
