<!doctype html>
<!--
  Obálka nepravidelného příspěvku (slide 1). 1080×1080.

  Přeneseno z projektu „Instagram carousel template pro Vládoměr". Runtime
  designového nástroje se nepřenáší, šablona je soběstačná: barvy i písmo
  inline, logo vložené přímo.

  Zástupné texty dosazuje render() z scripts/lib/nastaveni.js, který shodí běh
  při jakémkoli nedosazeném symbolu. (Do komentáře se proto nesmí napsat
  dvojitá složená závorka, kontrola ji najde i tady.)

  VELIKOST_TITULKU počítá adhoc.js podle délky titulku — na obálku se vejde
  jen omezený počet znaků, než text přeteče přes spodní štítek.
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  body{margin:0}
  *{box-sizing:border-box}
</style>
</head>
<body>
<div style="width:1080px;height:1080px;background:#0B0F19;color:#E8EDF7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'DejaVu Sans',Helvetica,Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div style="height:14px;display:flex;flex:none">
<div style="flex:1;background:#fff"></div><div style="flex:1;background:#3f7fd6"></div><div style="flex:1;background:#ff5a5f"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;position:relative;text-align:center">
<div style="position:absolute;top:56px;right:72px;font-size:20px;font-weight:700;color:#8B96AB;background:#121824;border:1px solid #232C3D;border-radius:999px;padding:8px 18px">{{STRANA}}</div>
<svg viewBox="0 0 64 64" style="width:140px;height:140px;flex:none">
  <rect width="64" height="64" rx="14" fill="#0F172A"></rect>
  <path d="M 16 44 A 20 20 0 1 1 48 44" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round"></path>
  <path d="M 32 32 L 44 20" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"></path>
  <circle cx="32" cy="32" r="5" fill="#F43F5E"></circle>
</svg>
<div style="margin-top:36px;font-size:24px;font-weight:800;letter-spacing:.14em;color:#5B7BE8;text-transform:uppercase">VLÁDOMĚR</div>
<div style="margin-top:26px;font-size:{{VELIKOST_TITULKU}}px;font-weight:820;letter-spacing:-.03em;line-height:1.05;max-width:840px;text-wrap:pretty">{{TITULEK}}</div>
<div style="margin-top:28px;font-size:32px;color:#8B96AB;line-height:1.4;max-width:720px;text-wrap:pretty">{{PODTITULEK}}</div>
<div style="position:absolute;bottom:64px;right:72px;font-size:20px;font-weight:700;color:#5B7BE8;background:rgba(91,123,232,.14);border-radius:999px;padding:10px 22px">{{STITEK_DALSI}} →</div>
</div>
</div>
</body>
</html>
