<!doctype html>
<!--
  Instagram carousel, slide 2 ze 2 — změny týdne. 1080×1080.

  Hlavička se schválně opakuje ze slidu 1 (viz instagram-1-souhrn.html); dva
  čitelné soubory se upravují snáz než skládačka ze sdílených kousků, a render()
  pracuje se soubory.

  Řádky změn se generují v post.js (1 až 3 podle toho, kolik jich týden
  přinesl) — tři prázdné rámečky ve slabém týdnu vypadají rozbitě.
  Tónovaná kolečka u šipek jsou tady ve <style>, protože se na ně generované
  řádky odkazují třídou.
-->

  .chg-down{color:#EF4444;background:rgba(239,68,68,.16)}
  .chg-same{color:#8B96AB;background:rgba(139,150,171,.16)}
</style>
</head>
<body>
<div style="width:1080px;height:1440px;background:#0B0F19;color:#E8EDF7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'DejaVu Sans',Helvetica,Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
