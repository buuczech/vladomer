<!doctype html>
<!--
  Informační slide nepravidelného příspěvku (2. až N.). 1080×1080.
  Vykresluje se jednou za každý slide v zadání.

  Řádky generuje adhoc.js a odkazují se na třídy níže: badge-dot je odrážka
  (modrá tečka), badge-num číslovaný krok. Proto jsou styly tady, ne inline.

  Hlavička se schválně opakuje z obálky; dva čitelné soubory se upravují snáz
  než skládačka ze sdílených kousků a render() pracuje se soubory.
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  body{margin:0}
  *{box-sizing:border-box}
  .badge-dot{width:20px;height:20px;border-radius:50%;background:#5B7BE8;flex:none}
  .badge-num{width:64px;height:64px;border-radius:50%;background:rgba(91,123,232,.16);color:#5B7BE8;
    display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:none;
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div style="width:1080px;height:1080px;background:#0B0F19;color:#E8EDF7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'DejaVu Sans',Helvetica,Arial,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
<div style="height:14px;display:flex;flex:none">
<div style="flex:1;background:#fff"></div><div style="flex:1;background:#3f7fd6"></div><div style="flex:1;background:#ff5a5f"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;padding:56px 72px 60px">

<div style="display:flex;align-items:center;justify-content:space-between;flex:none">
<div style="display:flex;align-items:center;gap:16px">
<svg viewBox="0 0 64 64" style="width:56px;height:56px;flex:none">
  <rect width="64" height="64" rx="14" fill="#0F172A"></rect>
  <path d="M 16 44 A 20 20 0 1 1 48 44" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round"></path>
  <path d="M 32 32 L 44 20" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"></path>
  <circle cx="32" cy="32" r="5" fill="#F43F5E"></circle>
</svg>
<div style="font-size:22px;font-weight:800;letter-spacing:.1em;color:#5B7BE8;text-transform:uppercase">VLÁDOMĚR</div>
</div>
<div style="font-size:20px;font-weight:700;color:#8B96AB;background:#121824;border:1px solid #232C3D;border-radius:999px;padding:8px 18px">{{STRANA}}</div>
</div>

<div style="margin-top:40px;font-size:{{VELIKOST_NADPISU}}px;font-weight:820;letter-spacing:-.03em;line-height:1.05;flex:none;text-wrap:pretty">{{NADPIS}}</div>

<div style="flex:1;display:flex;flex-direction:column;gap:20px;margin-top:40px;min-height:0">
{{RADKY}}
</div>

<div style="margin-top:28px;padding-top:24px;border-top:1px solid #232C3D;font-size:19px;color:#8B96AB;line-height:1.4;flex:none">
<div>{{VYHRADA}}</div>
<div style="font-size:16px;color:#5B6472;margin-top:4px">vladomer.cz</div>
</div>
</div>
</div>
</body>
</html>
