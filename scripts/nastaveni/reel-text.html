<!doctype html>
<!--
  Scéna reelu: velký text na střed. 1080×1920 (9:16).
  Používá se jako úvodní hák i jako závěrečná výzva.

  V design systému šablona na reels není, tahle vychází z jeho palety
  a typografie, aby reel seděl k webu i k příspěvkům: pozadí #0B0F19,
  trikolóra, modrá #5B7BE8 na značku.

  Prázdné místo dole není omyl. Instagram si přes spodní pětinu reelu kreslí
  popisek, jméno účtu a tlačítka a přes horní okraj svoje záhlaví; obsah proto
  drží uvnitř bezpečné zóny (nahoře 190 px, dole 400 px). Ze stejného důvodu
  není trikolóra pruhem přes celou šířku — pomalé najetí ffmpegu ořízne pár
  desítek pixelů u okrajů a pruh by zmizel. Drží se proto u loga.

  Text musí být čitelný na mobilu bez zvuku a za pár vteřin — proto velké
  písmo a málo slov. VELIKOST_TITULKU počítá reel.js podle délky.

  Dosazuje render() z scripts/lib/nastaveni.js; nedosazený symbol shodí běh.
  (Do komentáře se proto nesmí napsat dvojitá složená závorka.)
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  body{margin:0}
  *{box-sizing:border-box}
  .trikolora{display:flex;width:132px;height:8px;border-radius:4px;overflow:hidden}
  .trikolora i{flex:1}
</style>
</head>
<body>
<div style="width:1080px;height:1920px;background:#0B0F19;color:#E8EDF7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'DejaVu Sans',Helvetica,Arial,sans-serif;position:relative;overflow:hidden">
<div style="position:absolute;inset:190px 90px 400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">

<svg viewBox="0 0 64 64" style="width:148px;height:148px;flex:none">
  <rect width="64" height="64" rx="14" fill="#0F172A"></rect>
  <path d="M 16 44 A 20 20 0 1 1 48 44" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round"></path>
  <path d="M 32 32 L 44 20" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"></path>
  <circle cx="32" cy="32" r="5" fill="#F43F5E"></circle>
</svg>
<div style="margin-top:38px;font-size:28px;font-weight:800;letter-spacing:.16em;color:#5B7BE8">VLÁDOMĚR</div>
<div class="trikolora" style="margin-top:20px"><i style="background:#fff"></i><i style="background:#3f7fd6"></i><i style="background:#ff5a5f"></i></div>

<div style="margin-top:64px;font-size:{{VELIKOST_TITULKU}}px;font-weight:820;letter-spacing:-.03em;line-height:1.08;text-wrap:pretty">{{TITULEK}}</div>
<div style="margin-top:40px;font-size:40px;color:#8B96AB;line-height:1.4;max-width:820px;text-wrap:pretty">{{PODTITULEK}}</div>

<div style="position:absolute;bottom:0;font-size:28px;color:#5B6472">vladomer.cz</div>
</div>
</div>
</body>
</html>
