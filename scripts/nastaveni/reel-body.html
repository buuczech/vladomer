<!doctype html>
<!--
  Scéna reelu: nadpis a body. 1080×1920 (9:16).

  Nejvýš čtyři body — na reelu se čte v pohybu a scéna trvá pár vteřin, takže
  víc textu si nikdo nepřečte. Kontroluje to reel.js.

  K bezpečné zóně a k trikolóře platí totéž co v reel-text.html.

  Řádky generuje reel.js a odkazují se na třídy níže; proto jsou styly tady,
  ne inline. Dosazuje render(); nedosazený symbol shodí běh.
-->
<html lang="cs">
<head>
<meta charset="utf-8">
<style>
  body{margin:0}
  *{box-sizing:border-box}
  .trikolora{display:flex;width:96px;height:7px;border-radius:4px;overflow:hidden}
  .trikolora i{flex:1}
  /* Řádky mají výšku podle textu, ne podle volného místa — dva body by se
     jinak roztáhly přes celou obrazovku a čtyři by přetekly. */
  .radek{background:#121824;border:1px solid #232C3D;border-radius:26px;padding:42px 44px;
    display:flex;align-items:center;gap:32px;flex:none}
  .tecka{width:24px;height:24px;border-radius:50%;background:#5B7BE8;flex:none}
  .cislo{width:78px;height:78px;border-radius:50%;background:rgba(91,123,232,.16);color:#5B7BE8;
    display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;flex:none;
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div style="width:1080px;height:1920px;background:#0B0F19;color:#E8EDF7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'DejaVu Sans',Helvetica,Arial,sans-serif;position:relative;overflow:hidden">
<div style="position:absolute;inset:285px 90px 510px;display:flex;flex-direction:column">

<div style="display:flex;align-items:center;gap:22px;flex:none">
<svg viewBox="0 0 64 64" style="width:68px;height:68px;flex:none">
  <rect width="64" height="64" rx="14" fill="#0F172A"></rect>
  <path d="M 16 44 A 20 20 0 1 1 48 44" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round"></path>
  <path d="M 32 32 L 44 20" stroke="#F43F5E" stroke-width="5" stroke-linecap="round"></path>
  <circle cx="32" cy="32" r="5" fill="#F43F5E"></circle>
</svg>
<div>
  <div style="font-size:26px;font-weight:800;letter-spacing:.14em;color:#5B7BE8">VLÁDOMĚR</div>
  <div class="trikolora" style="margin-top:10px"><i style="background:#fff"></i><i style="background:#3f7fd6"></i><i style="background:#ff5a5f"></i></div>
</div>
</div>

<div style="margin-top:52px;font-size:{{VELIKOST_NADPISU}}px;font-weight:820;letter-spacing:-.03em;line-height:1.06;flex:none;text-wrap:pretty">{{NADPIS}}</div>

<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:0">
{{RADKY}}
</div>

<div style="font-size:28px;color:#5B6472;flex:none">vladomer.cz</div>
</div>
</div>
</body>
</html>
